name = alex
summary = "Alex"
description = """Use Apple's downloadable macOS Alex voice in NVDA with the modern Sonoma speech engine or the legacy Lion engine. Open Settings, Alex, or Tools, Alex setup, to download and prepare the components directly from Apple, with progress, cancellation and retry. Keep both engines, switch between them, or remove either one's data. Apple components are not included in this add-on."""
author = "Matthew Alvernaz; includes Panthera Speech by Tamas Geczy"
