name = alex
summary = "Alex"
description = """Use Apple's downloadable macOS Alex voice in NVDA. Open Settings, Alex, or Tools, Alex setup, to download and set up all required Apple components with progress, cancellation and retry. Apple's files are downloaded directly to your computer and are not included in this add-on. This build runs the downloaded voice data through the Lion speech engine using Panthera's compatibility layer."""
author = "Matthew Alvernaz; includes Panthera Speech by Tamas Geczy"
version = 0.1.0
minimumNVDAVersion = 2024.1
lastTestedNVDAVersion = 2026.1
updateChannel = None
