# Build and test our code only; CI must never fetch an Apple component.
name: Build Alex add-on
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refuse proprietary files in source
        run: python3 tools/check_repository.py
      - name: Install the native compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686
      - name: Fetch the open-source AAC decoder
        run: git clone --no-checkout https://github.com/CrispStrobe/glint.git build-glint
      - name: Build the native Windows host
        run: python3 tools/build_host.py --glint-source build-glint
      - name: Run tests with synthetic fixtures
        run: python3 -m unittest discover -s tests -v
      - name: Package and check the add-on
        run: python3 tools/package.py
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          path-type: inherit
          install: mingw-w64-i686-gcc git
      - name: Fetch the open-source AAC decoder
        shell: msys2 {0}
        run: git clone --no-checkout https://github.com/CrispStrobe/glint.git build-glint
      - name: Build and exercise the Windows host without Apple data
        shell: msys2 {0}
        run: |
          python tools/build_host.py --cc gcc --cxx g++ --windres windres --glint-source build-glint
          ./build/windows/alex_host.exe --numbers-check
          ./build/windows/alex_host.exe --regex-check
          ./build/windows/alex_host.exe --audio-timeline-check
          ./build/windows/alex_host.exe --tempfile-check
          ./build/windows/alex_host.exe --stack-check
      - name: Test setup and package contents
        run: |
          python -m unittest discover -s tests -v
          python tools/package.py
